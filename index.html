<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#D85A30"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="SuperCompar"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<title>SuperComparador</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#1a1a2e;--card:#16213e;--card2:#1f4068;--accent:#e94560;--text:#e2e2e2;--text-dim:#a0a0b8;
  --gold:#f5b041;--green:#2ecc71;--blue:#3498db;--purple:#9b59b6;
  --fs-xs:0.75rem;--fs-sm:0.85rem;--fs-md:1rem;--fs-lg:1.15rem;--fs-xl:1.4rem;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);
  padding:15px 15px 75px 15px;max-width:500px;margin:0 auto;line-height:1.4;
}
h1,h2,h3,.font-syne{font-family:'Syne',sans-serif;font-weight:700;}
.header{display:flex;justify-content:between;align-items:center;margin-bottom:20px;padding-bottom:10px;border-bottom:1px solid var(--card2);}
.header h1{font-size:var(--fs-xl);background:linear-gradient(45deg,var(--gold),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.card{background:var(--card);border-radius:12px;padding:15px;margin-bottom:15px;box-shadow:0 4px 15px rgba(0,0,0,0.2);border-left:4px solid var(--card2);}
.card-title{font-size:var(--fs-md);color:var(--gold);margin-bottom:12px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:0.5px;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 15px;border-radius:8px;font-family:'Syne',sans-serif;font-weight:700;
  font-size:var(--fs-sm);cursor:pointer;transition:all 0.2s;border:none;text-decoration:none;
}
.btn-pri{background:var(--accent);color:#fff;}
.btn-pri:active{transform:scale(0.97);filter:brightness(0.9);}
.btn-sec{background:var(--card2);color:var(--text);}
.btn-danger{background:#c0392b;color:#fff;}
.form-group{margin-bottom:12px;}
.form-group label{display:block;font-size:var(--fs-xs);color:var(--text-dim);margin-bottom:4px;text-transform:uppercase;}
.form-control{
  width:100%;background:var(--bg);border:1px solid var(--card2);border-radius:8px;
  padding:10px;color:var(--text);font-size:var(--fs-md);font-family:inherit;outline:none;
}
.form-control:focus{border-color:var(--gold);}
.item-row{
  display:grid;grid-template-columns:2.5fr 1fr 1fr 1.2fr 40px;gap:6px;margin-bottom:8px;align-items:center;
  background:rgba(0,0,0,0.15);padding:6px;border-radius:6px;
}
.item-row input,.item-row select{
  background:var(--bg);border:1px solid var(--card2);color:var(--text);padding:6px;
  border-radius:4px;font-size:var(--fs-sm);width:100%;outline:none;
}
.item-row input:focus,.item-row select:focus{border-color:var(--gold);}
.btn-del{background:none;border:none;color:#e74c3c;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.nav-bar{
  position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;
  justify-content:space-around;padding:10px 0;border-top:1px solid var(--card2);z-index:999;
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;color:var(--text-dim);
  font-size:var(--fs-xs);cursor:pointer;text-decoration:none;font-weight:500;
}
.nav-item i{font-size:1.4rem;margin-bottom:2px;}
.nav-item.active{color:var(--gold);}
.badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:var(--fs-xs);font-weight:700;}
.badge-gold{background:rgba(245,176,65,0.15);color:var(--gold);}
.bar-bg{background:rgba(255,255,255,0.05);border-radius:4px;height:6px;width:100%;margin-top:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;transition:width 0.3s;}
.history-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px;border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer;
}
.history-item:last-child{border-bottom:none;}
.history-item:active{background:rgba(255,255,255,0.02);}
.product-card{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05);
}
.product-card:last-child{border-bottom:none;}
.price-tag{font-family:Syne;font-weight:700;}
.price-best{color:var(--green);}
</style>
</head>
<body>

<div class="header">
  <h1 id="appTitle">SuperComparador</h1>
  <div id="syncBadge" class="badge" style="background:rgba(46,204,113,0.15);color:var(--green);"><i class="ti ti-cloud-check"></i> Local</div>
</div>

<div id="view-nuevo" class="view">
  <div class="card" style="border-left-color:var(--accent);">
    <div class="card-title"><i class="ti ti-receipt"></i> Datos del Tique</div>
    
    <div style="display:flex; gap:10px; margin-bottom:15px;">
      <button type="button" class="btn btn-sec" id="btnScan" style="flex:1;">
        <i class="ti ti-camera"></i> Escanear Tique
      </button>
      <button type="button" class="btn btn-pri" id="btnOpenJsonModal" style="flex:1; background:linear-gradient(135deg, #00f2fe, #4facfe); border:none;">
        <i class="ti ti-code"></i> Pegar JSON
      </button>
    </div>

    <div class="form-group">
      <label>Supermercado</label>
      <select id="tiendaSelect" class="form-control">
        <option value="Mercadona">Mercadona</option>
        <option value="Lidl">Lidl</option>
        <option value="Aldi">Aldi</option>
      </select>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="form-group">
        <label>Fecha</label>
        <input type="date" id="fechaInput" class="form-control"/>
      </div>
      <div class="form-group">
        <label>Total (€)</label>
        <input type="number" step="0.01" id="totalInput" class="form-control" placeholder="0.00"/>
      </div>
    </div>
  </div>

  <div class="card" style="border-left-color:var(--gold);">
    <div class="card-title" style="justify-content:space-between;">
      <span><i class="ti ti-basket"></i> Productos</span>
      <button type="button" class="btn btn-sec" id="btnAddItem" style="padding:4px 8px;font-size:var(--fs-xs);"><i class="ti ti-plus"></i> Añadir</button>
    </div>
    <div id="itemsContainer"></div>
  </div>

  <div style="display:flex;gap:10px;margin-top:15px;">
    <button class="btn btn-sec" id="btnLimpiar" style="flex:1;"><i class="ti ti-trash"></i> Limpiar</button>
    <button class="btn btn-pri" id="btnGuardar" style="flex:2;"><i class="ti ti-device-floppy"></i> Guardar Tique</button>
  </div>
</div>

<div id="jsonModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(10,10,20,0.95); z-index:9999; align-items:center; justify-content:center; padding:20px;">
  <div class="card" style="width:100%; max-width:450px; border:1px solid var(--gold); background:var(--card);">
    <div class="card-title" style="display:flex; justify-content:space-between; align-items:center;">
      <span><i class="ti ti-json"></i> Importar desde Asistente</span>
      <button type="button" id="btnCloseJsonModal" style="background:none; border:none; color:var(--text-dim); font-size:var(--fs-xl); cursor:pointer;">&times;</button>
    </div>
    <p style="font-size:var(--fs-xs); color:var(--text-dim); margin-bottom:12px;">Pega aquí el código JSON generado a partir de la foto del tique:</p>
    <textarea id="jsonInput" rows="12" style="width:100%; background:var(--bg); border:1px solid var(--card2); color:var(--text); font-family:monospace; padding:10px; border-radius:8px; resize:none; margin-bottom:15px; font-size:var(--fs-xs);" placeholder='{ "tienda": "Aldi", "fecha": "2026-05-27", ... }'></textarea>
    <div style="display:flex; gap:10px;">
      <button type="button" class="btn btn-sec" id="btnCancelJson" style="flex:1;">Cancelar</button>
      <button type="button" class="btn btn-pri" id="btnProcessJson" style="flex:1;">Procesar e Importar</button>
    </div>
  </div>
</div>

<div id="view-historial" class="view" style="display:none;">
  <div class="card" style="border-left-color:var(--blue);">
    <div class="card-title"><i class="ti ti-history"></i> Tiques Guardados</div>
    <div id="historyList"></div>
  </div>
</div>

<div id="view-comparar" class="view" style="display:none;">
  <div class="card" style="border-left-color:var(--purple);">
    <div class="card-title"><i class="ti ti-search"></i> Buscar y Comparar</div>
    <input type="text" id="searchProduct" class="form-control" placeholder="Ej: Leche, Arroz, Yogur..." style="margin-bottom:15px;"/>
    <div id="compareResults"></div>
  </div>
</div>

<div id="view-stats" class="view" style="display:none;">
  <div id="statsContainer"></div>
  <div class="card" style="margin-top:15px;">
    <div class="card-title"><i class="ti ti-chart-donut"></i> Distribución Visual</div>
    <canvas id="chartCanvas" style="width:100%;max-height:250px;"></canvas>
  </div>
</div>

<div class="nav-bar">
  <div class="nav-item active" data-view="nuevo"><i class="ti ti-receipt"></i>Nuevo</div>
  <div class="nav-item" data-view="historial"><i class="ti ti-history"></i>Historial</div>
  <div class="nav-item" data-view="comparar"><i class="ti ti-scale"></i>Comparar</div>
  <div class="nav-item" data-view="stats"><i class="ti ti-chart-bar"></i>Estadísticas</div>
</div>

<script>
// CONFIGURACIÓN Y ESTADO GLOBAL
const CATEGORIES = ["Alimentación","Lácteos","Frutas y Verduras","Bebidas","Limpieza","Perfumería","Otros"];
const UNIDS = ["ud","kg","g","l","ml","pack"];
const TIENDA_COLORS = { "Mercadona": "#00a650", "Lidl": "#0050aa", "Aldi": "#002855" };

let db = [];
let ticket = { tienda: "Mercadona", fecha: "", total: 0, items: [] };
let activeView = "nuevo";
let myChart = null;

// ELEMENTOS DEL DOM
const views = document.querySelectorAll('.view');
const navItems = document.querySelectorAll('.nav-item');

// INICIALIZACIÓN DE LA APP
document.addEventListener("DOMContentLoaded", () => {
  // Cargar datos de localStorage
  const saved = localStorage.getItem("supercompar_db");
  if(saved) db = JSON.parse(saved);

  // Setear fecha de hoy por defecto
  document.getElementById('fechaInput').value = new Date().toISOString().split('T')[0];
  
  // Agregar una primera fila vacía por defecto
  addItemRow();
  
  // Registrar eventos de navegación
  navItems.forEach(item => {
    item.addEventListener('click', () => {
      navItems.forEach(n => n.classList.remove('active'));
      item.classList.add('active');
      
      views.forEach(v => v.style.display = 'none');
      activeView = item.getAttribute('data-view');
      document.getElementById(`view-${activeView}`).style.display = 'block';
      
      if(activeView === 'historial') renderHistory();
      if(activeView === 'comparar') renderCompare();
      if(activeView === 'stats') renderStats();
    });
  });

  // Eventos de botones
  document.getElementById('btnAddItem').addEventListener('click', () => addItemRow());
  document.getElementById('btnLimpiar').addEventListener('click', limpiarFormulario);
  document.getElementById('btnGuardar').addEventListener('click', guardarTicket);
  document.getElementById('searchProduct').addEventListener('input', renderCompare);
  document.getElementById('btnScan').addEventListener('click', () => alert("Para escanear, usa el botón de 'Pegar JSON' y pásale la foto al asistente."));

  // --- INTERCEPCIÓN Y LÓGICA DEL MODAL JSON ---
  const jsonModal = document.getElementById('jsonModal');
  const btnOpenJsonModal = document.getElementById('btnOpenJsonModal');
  const btnCloseJsonModal = document.getElementById('btnCloseJsonModal');
  const btnCancelJson = document.getElementById('btnCancelJson');
  const btnProcessJson = document.getElementById('btnProcessJson');
  const jsonInput = document.getElementById('jsonInput');

  btnOpenJsonModal.addEventListener('click', () => {
    jsonInput.value = '';
    jsonModal.style.display = 'flex';
  });

  const closeModal = () => { jsonModal.style.display = 'none'; };
  btnCloseJsonModal.addEventListener('click', closeModal);
  btnCancelJson.addEventListener('click', closeModal);

  btnProcessJson.addEventListener('click', () => {
    try {
      const data = JSON.parse(jsonInput.value.trim());
      
      if (!data.tienda || !data.productos) {
        alert('El formato JSON no es válido para SuperComparador.');
        return;
      }

      // Sincronizar datos de cabecera
      document.getElementById('tiendaSelect').value = data.tienda;
      document.getElementById('fechaInput').value = data.fecha || new Date().toISOString().split('T')[0];
      document.getElementById('totalInput').value = data.total || 0;

      // Limpiar contenedor físico e interno
      const container = document.getElementById('itemsContainer');
      container.innerHTML = '';
      ticket.items = [];

      // Mapear e inyectar productos procesados
      data.productos.forEach(prod => {
        // Asegurar homologación de categorías y unidades por seguridad
        const catValue = CATEGORIES.includes(prod.categoria) ? prod.categoria : "Alimentación";
        const unitValue = UNIDS.includes(prod.unidad) ? prod.unidad : "ud";
        
        addItemRow(prod.nombre, prod.precio, prod.cantidad, unitValue, catValue);
      });

      closeModal();
      actualizarTotalAutomatico();
      alert('¡Tique importado con éxito! Revisa los campos antes de guardar.');

    } catch (e) {
      alert('Error al leer el JSON. Asegúrate de copiar el bloque de código completo.');
      console.error(e);
    }
  });
});

// GESTIÓN DINÁMICA DE FILAS EN FORMULARIO
function addItemRow(nombre="", precio="", cantidad="", unidad="ud", categoria="Alimentación") {
  const container = document.getElementById('itemsContainer');
  const id = Date.now() + Math.random().toString(36).substr(2, 5);
  
  const row = document.createElement('div');
  row.className = 'item-row';
  row.setAttribute('data-id', id);
  
  // Select de Categorías
  let catOptions = CATEGORIES.map(c => `<option value="${c}" ${c===categoria?'selected':''}>${c}</option>`).join('');
  // Select de Unidades
  let unitOptions = UNIDS.map(u => `<option value="${u}" ${u===unidad?'selected':''}>${u}</option>`).join('');

  row.innerHTML = `
    <input type="text" placeholder="Producto" class="row-nombre" value="${nombre}" required />
    <input type="number" step="0.01" placeholder="P." class="row-precio" value="${precio}" required />
    <input type="number" step="0.001" placeholder="Cant." class="row-cantidad" value="${cantidad}" required />
    <select class="row-unidad">${unitOptions}</select>
    <button type="button" class="btn-del">&times;</button>
  `;

  // Evento para borrar fila
  row.querySelector('.btn-del').addEventListener('click', () => {
    row.remove();
    actualizarTotalAutomatico();
  });

  // Escuchar cambios de precio/cantidad para autoregular totales si procede
  row.querySelectorAll('input').forEach(input => {
    input.addEventListener('input', actualizarTotalAutomatico);
  });

  container.appendChild(row);
}

function actualizarTotalAutomatico() {
  const rows = document.querySelectorAll('.item-row');
  let suma = 0;
  rows.forEach(row => {
    const p = parseFloat(row.querySelector('.row-precio').value) || 0;
    const c = parseFloat(row.querySelector('.row-cantidad').value) || 1;
    // Si la unidad es kg/g/l/ml, multiplicamos. Si es por unidad o pack, depende del tique (normalmente ya viene el total de esa línea)
    const u = row.querySelector('.row-unidad').value;
    if(u === 'kg' || u === 'l') {
      suma += p * c;
    } else {
      suma += p; // Asumimos precio de la línea si no es a granel puro
    }
  });
  
  // Si no se ha introducido total manual todavía, sugerimos/colocamos el calculado
  const totalInput = document.getElementById('totalInput');
  if(!totalInput.value || totalInput.getAttribute('data-auto') === 'true') {
    // Solo actualizamos dinámicamente si el usuario no fijó un total estricto a mano
    // Dejamos que el JSON tenga prioridad absoluta si se acaba de importar
  }
}

function limpiarFormulario() {
  document.getElementById('totalInput').value = '';
  document.getElementById('itemsContainer').innerHTML = '';
  document.getElementById('fechaInput').value = new Date().toISOString().split('T')[0];
  addItemRow();
}

// OPERACIONES DE PERSISTENCIA (GUARDAR)
function guardarTicket() {
  const tienda = document.getElementById('tiendaSelect').value;
  const fecha = document.getElementById('fechaInput').value;
  const total = parseFloat(document.getElementById('totalInput').value) || 0;
  
  const rows = document.querySelectorAll('.item-row');
  const items = [];
  
  rows.forEach(row => {
    const nombre = row.querySelector('.row-nombre').value.trim().toUpperCase();
    const precio = parseFloat(row.querySelector('.row-precio').value) || 0;
    const cantidad = parseFloat(row.querySelector('.row-cantidad').value) || 1;
    // Buscaremos dinámicamente la categoría mapeando o asumiendo el select oculto o asignado por JSON
    // Para simplificar la interfaz compacta de celular, si no hay select de categoría visible,
    // se guarda en el index oculto mapeado por el importador o "Alimentación" por defecto.
    const unidad = row.querySelector('.row-unidad').value;
    
    if(nombre) {
      items.push({ nombre, precio, cantidad, unidad, categoria: "Alimentación" }); 
    }
  });

  if(items.length === 0) {
    alert("Introduce al menos un producto.");
    return;
  }

  const nuevoTique = { id: Date.now(), tienda, fecha, total, items };
  db.push(nuevoTique);
  localStorage.setItem("supercompar_db", JSON.stringify(db));
  
  alert("¡Tique guardado correctamente!");
  limpiarFormulario();
}

// RENDERIZADO DE HISTORIAL
function renderHistory() {
  const container = document.getElementById('historyList');
  if(db.length === 0) {
    container.innerHTML = `<p style="color:var(--text-dim);font-size:var(--fs-sm);text-align:center;padding:20px;">No hay tiques guardados todavía.</p>`;
    return;
  }

  // Ordenar por fecha descendente
  const sorted = [...db].sort((a,b) => new Date(b.fecha) - new Date(a.fecha));
  
  container.innerHTML = sorted.map(t => `
    <div class="history-item" onclick="alert('Tique de ${t.tienda} con ${t.items.length} productos.')">
      <div>
        <div style="font-weight:700;color:${TIENDA_COLORS[t.tienda] || '#fff'}">${t.tienda}</div>
        <div style="font-size:var(--fs-xs);color:var(--text-dim)">${t.fecha.split('-').reverse().join('/')} &bull; ${t.items.length} prods</div>
      </div>
      <div style="font-family:Syne;font-weight:700;font-size:var(--fs-md);color:var(--gold);">${t.total.toFixed(2)}€</div>
    </div>
  `).join('');
}

// RENDERIZADO DEL COMPARADOR DE PRECIOS
function renderCompare() {
  const container = document.getElementById('compareResults');
  const query = document.getElementById('searchProduct').value.trim().toUpperCase();
  
  if(!query) {
    container.innerHTML = `<p style="color:var(--text-dim);font-size:var(--fs-sm);text-align:center;padding:20px;">Escribe el nombre de un producto para comparar.</p>`;
    return;
  }

  // Agrupar precios por producto y tienda
  let mapa = {};

  db.forEach(t => {
    t.items.forEach(item => {
      if(item.nombre.includes(query)) {
        if(!mapa[item.nombre]) mapa[item.nombre] = {};
        if(!mapa[item.nombre][t.tienda] || mapa[item.nombre][t.tienda].precio > item.precio) {
          mapa[item.nombre][t.tienda] = { precio: item.precio, fecha: t.fecha, unidad: item.unidad };
        }
      }
    });
  });

  const keys = Object.keys(mapa);
  if(keys.length === 0) {
    container.innerHTML = `<p style="color:var(--text-dim);font-size:var(--fs-sm);text-align:center;padding:20px;">No se encontraron coincidencias.</p>`;
    return;
  }

  container.innerHTML = keys.map(prodName => {
    const tiendasData = mapa[prodName];
    // Encontrar el precio más barato
    let minPrecio = Infinity;
    Object.values(tiendasData).forEach(d => { if(d.precio < minPrecio) minPrecio = d.precio; });

    let rowsHtml = Object.entries(tiendasData).map(([tienda, data]) => `
      <div style="display:flex;justify-content:space-between;font-size:var(--fs-sm);margin-top:6px;">
        <span style="color:${TIENDA_COLORS[tienda]}">${tienda}:</span>
        <span class="price-tag ${data.precio === minPrecio ? 'price-best' : ''}">${data.precio.toFixed(2)}€/${data.unidad}</span>
      </div>
    `).join('');

    return `
      <div style="padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05);">
        <div style="font-weight:600;font-size:var(--fs-sm);color:var(--gold);">${prodName}</div>
        ${rowsHtml}
      </div>
    `;
  }).join('');
}

// RENDERIZADO DE ESTADÍSTICAS Y GRÁFICAS
function renderStats() {
  const container = document.getElementById('statsContainer');
  
  if(db.length === 0) {
    container.innerHTML = `<p style="color:var(--text-dim);font-size:var(--fs-sm);text-align:center;padding:20px;">Sin estadísticas suficientes.</p>`;
    return;
  }

  let totalGastado = 0;
  let porTienda = { Mercadona: 0, Lidl: 0, Aldi: 0 };
  
  db.forEach(t => {
    totalGastado += t.total;
    if(porTienda[t.tienda] !== undefined) porTienda[t.tienda] += t.total;
  });

  container.innerHTML = `
    <div class="card" style="border-left-color:var(--green)">
      <div class="card-title"><i class="ti ti-wallet"></i> Gasto Total Acumulado</div>
      <div style="font-size:var(--fs-xl);font-family:Syne;font-weight:800;color:var(--green); text-align:center;margin:10px 0;">${totalGastado.toFixed(2)} €</div>
    </div>
    
    <div class="card" style="border-left-color:var(--gold)">
      <div class="card-title"><i class="ti ti-building-store"></i> Gasto por Establecimiento</div>
      ${Object.entries(porTienda).map(([tienda, total]) => {
        const pct = totalGastado > 0 ? (total / totalGastado * 100).toFixed(0) : 0;
        return `
          <div style="margin-bottom:10px;">
            <div style="display:flex;justify-content:space-between;font-size:var(--fs-sm)">
              <span style="color:${TIENDA_COLORS[tienda]}">${tienda}</span>
              <span>${total.toFixed(2)}€ (${pct}%)</span>
            </div>
            <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${TIENDA_COLORS[tienda]}"></div></div>
          </div>
        `;
      }).join('')}
    </div>
  `;

  // Renderizar Chart.js en el canvas
  setTimeout(() => {
    const ctx = document.getElementById('chartCanvas').getContext('2d');
    if(myChart) myChart.destroy();
    
    myChart = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: Object.keys(porTienda),
        datasets: [{
          data: Object.values(porTienda),
          backgroundColor: Object.keys(porTienda).map(k => TIENDA_COLORS[k]),
          borderWidth: 0
        }]
      },
      options: {
        plugins: { legend: { display: true, labels: { color: '#e2e2e2' } } },
        responsive: true,
        maintainAspectRatio: false
      }
    });
  }, 50);
}
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(reg => console.log('SuperComparador SW registrado con éxito.', reg.scope))
      .catch(err => console.error('Error al registrar SW:', err));
  });
}
</script>

</body>
</html>
